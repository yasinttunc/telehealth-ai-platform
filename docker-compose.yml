services:
  postgres:
    build:
      context: ./infra/postgres
    image: telehealth-ai-postgres:local
    container_name: telehealth-ai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-telehealth}
      POSTGRES_USER: ${POSTGRES_USER:-telehealth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-telehealth}
    ports:
      - "55432:5432"
    volumes:
      - telehealth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-telehealth} -d ${POSTGRES_DB:-telehealth}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  telehealth_postgres_data:
