name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Spring Boot API
    runs-on: ubuntu-latest
    env:
      TRANSCRIPTION_WORKER_ENABLED: "false"
      AI_PROVIDER: mock
      JWT_SECRET: ci-only-secret-not-used-anywhere-else-0123456789abcdef
    steps:
      - uses: actions/checkout@v4

      - name: Start PostgreSQL with schema and seed data
        run: docker compose up -d --wait postgres

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and run tests
        run: ./mvnw -B verify

      - name: Database logs on failure
        if: failure()
        run: docker compose logs postgres

  ai-service:
    name: AI service (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: ai-service/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests (live tests stay skipped without credentials)
        run: python -m pytest -q

  evaluation:
    name: Evaluation harness (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evaluation
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: evaluation/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests (corpus tests skip without MediTOD data)
        run: python -m pytest -q

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build
