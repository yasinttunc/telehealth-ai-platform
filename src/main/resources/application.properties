spring.application.name=Telehealth_With_AI
# Load local development settings when the app is started from the project root.
# Real environment variables still override these values in deployed environments.
spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:55432/telehealth}
spring.datasource.username=${DB_USERNAME:telehealth}
spring.datasource.password=${DB_PASSWORD:telehealth}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

server.port=${SERVER_PORT:8081}
# Local fallback exists only to reduce setup friction. Replace it using an
# environment variable before recording a public demo or pushing to GitHub.
app.jwt.secret=${JWT_SECRET:change-this-local-demo-secret-to-a-long-random-value-32-bytes-minimum}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}
app.cors.allowed-origin=${FRONTEND_ORIGIN:http://localhost:5173}


app.ai.provider=${AI_PROVIDER:mock}
app.ai.base-url=${AI_SERVICE_URL:http://localhost:8000}
app.ai.timeout-seconds=${AI_TIMEOUT_SECONDS:45}
app.ai.prompt-version=${AI_PROMPT_VERSION:symptom-extraction-v1}

app.internal.service-key=${INTERNAL_SERVICE_KEY:}


# Livekit
# Public WebSocket URL used by browsers to connect to LiveKit.
app.livekit.url=${LIVEKIT_URL:}

# Server-side credentials used only by Spring to sign room tokens.
app.livekit.api-key=${LIVEKIT_API_KEY:}
app.livekit.api-secret=${LIVEKIT_API_SECRET:}

# A token may be used to establish a connection for two minutes.
app.livekit.token-ttl-ms=${LIVEKIT_TOKEN_TTL_MS:120000}

# Starts one local Python transcription worker per active consultation.
app.transcription.worker.enabled=${TRANSCRIPTION_WORKER_ENABLED:true}

# Paths are resolved from the Spring project working directory.
app.transcription.worker.python=${TRANSCRIPTION_WORKER_PYTHON:ai-service/.venv/bin/python}
app.transcription.worker.working-directory=${TRANSCRIPTION_WORKER_DIRECTORY:ai-service}

# Worker sends every 15 seconds; four missed signals produce FAILED.
app.transcription.worker.stale-after-seconds=${TRANSCRIPTION_STALE_AFTER_SECONDS:60}
app.transcription.worker.watchdog-delay-ms=${TRANSCRIPTION_WATCHDOG_DELAY_MS:15000}

# Interactive documentation is deliberately limited to browser-facing API routes.
springdoc.paths-to-match=/api/**
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
